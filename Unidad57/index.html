<script>
const E = t => `<span class="es" role="button" tabindex="0" data-say="${t.replace(/"/g,'&quot;')}">${t}</span>`;
const chips = arr => `<div class="chips">${arr.map(E).join('')}</div>`;
const tbl = (head, rows) => `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const warn = h => `<div class="note warn"><b class="lab">ATENCIÓN</b>${h}</div>`;
const pero = h => `<div class="note pero"><b class="lab">PERO</b>${h}</div>`;
const ELLA = ['el','la'];
const pk = (q,o,a,why) => ({t:'pick',q,o,a,why});
const tx = (q,a,why) => ({t:'text',q,a:Array.isArray(a)?a:[a],why});

const X = (title,instr,rule,items) => ({title,instr,rule,items});
const P = (o,rows) => rows.map(r=>pk(r[0],o,r[1],r[2]));
const T = rows => rows.map(r=>tx(r[0],r[1],r[2]));
const DEF = ['el','la','los','las'];
const INDEF = ['un','una','unos','unas'];

const CH = [null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,{"id":57,"es":"hago / estoy haciendo","ko":"현재형 vs estar + 현재분사","desc":"습관·보편적 사실(현재형)과 지금 진행 중인 일시적 동작(estar + gerundio)의 차이, 진행형을 쓰지 않는 동사를 배웁니다.","theory":"\n<h2>핵심 정리</h2>\n<p class=\"tip\">🔊 예문을 누르면 발음을 들을 수 있어요.</p>\n<div class=\"tw\"><table><thead><tr><th>현재형</th><th>estar + 현재분사</th></tr></thead><tbody><tr><td><b>습관적</b> 행동<br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hago gimnasia todas las mañanas.\">Hago gimnasia todas las mañanas.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En mi casa comemos a las dos.\">En mi casa comemos a las dos.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Normalmente pasamos el verano en Lugo.\">Normalmente pasamos el verano en Lugo.</span></td><td><b>지금 진행 중</b>인 짧은 동작<br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estoy haciendo un rompecabezas.\">Estoy haciendo un rompecabezas.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué estáis comiendo?\">¿Qué estáis comiendo?</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Está tocando una canción mexicana.\">Está tocando una canción mexicana.</span></td></tr><tr><td><b>보편적 진리</b><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En Venezuela llueve mucho en invierno.\">En Venezuela llueve mucho en invierno.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Trabajo en Santiago.\">Trabajo en Santiago.</span></td><td><b>일시적</b> 상황 (esta semana, este mes, últimamente…)<br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este verano está haciendo frío.\">Este verano está haciendo frío.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta semana estoy trabajando en Iquique.\">Esta semana estoy trabajando en Iquique.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No salgas. Está lloviendo mucho.\">No salgas. Está lloviendo mucho.</span></td></tr></tbody></table></div>\n<h3>진행형을 보통 쓰지 않는 경우</h3>\n<ul class=\"rules\">\n<li><b>ir, venir</b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Adónde vais? –Vamos a la playa.\">¿Adónde vais? –Vamos a la playa.</span> <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿De dónde vienes? –Vengo de una fiesta.\">¿De dónde vienes? –Vengo de una fiesta.</span></li>\n<li><b>conocer, comprender, entender, querer, necesitar, amar, preferir, odiar, parecer, saber, tener, llevar</b>(상태 동사): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alicia no lleva nunca vaqueros.\">Alicia no lleva nunca vaqueros.</span> <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes dinero? –Necesito 50 euros.\">¿Tienes dinero? –Necesito 50 euros.</span></li>\n<li><b>ver, oír</b> (mirar/escuchar의 뜻이 아닐 때): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Félix no oye nada por el oído izquierdo.\">Félix no oye nada por el oído izquierdo.</span> <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Oyes algo? –Nada.\">¿Oyes algo? –Nada.</span><br>단 <b>escuchar</b>의 뜻이면 가능: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estoy oyendo la radio.\">Estoy oyendo la radio.</span></li>\n</ul>\n<p>가끔 진행 중인 일도 현재형으로 말합니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"–¿Qué haces? –Nada. Leo un rato.\">–¿Qué haces? –Nada. Leo un rato.</span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"–¿Qué estás haciendo? –Estoy leyendo el periódico.\">–¿Qué estás haciendo? –Estoy leyendo el periódico.</span></p>","ex":[{"title":"연습 1. 현재형 또는 진행형","instr":"괄호 안의 동사를 알맞게 활용하세요. (현재형이나 estar + gerundio 중 알맞은 것)","rule":"습관·사실 → 현재형 / 지금·일시적 → estar + gerundio.","items":[{"t":"text","q":"En el desierto de Atacama (no llover) ___ nunca.","a":["no llueve"],"why":"보편적 사실 → 현재형 <b>no llueve</b>."},{"t":"text","q":"¿(tú, hablar) ___ portugués? –Un poco.","a":["hablas"],"why":"능력·습관 → 현재형 <b>hablas</b>."},{"t":"text","q":"Este invierno (no hacer) ___ mucho frío.","a":["no hace"],"why":"날씨 서술 → 현재형 <b>no hace</b> (este invierno 일시적이지만 hacer + 날씨는 현재형 가능)."},{"t":"text","q":"Este invierno (llover) ___ mucho.","a":["llueve"],"why":"날씨 → <b>llueve</b> (llover는 o→ue 동사, 3인칭 단수만 사용)."},{"t":"text","q":"–¿Dónde (tú, trabajar) ___? –Soy abogado, pero este verano trabajo de camarero.","a":["trabajas"],"why":"직업(습관) → 현재형 <b>trabajas</b>."},{"t":"text","q":"–¿Está Rosa? –Sí, pero (dormir) ___.","a":["está durmiendo"],"why":"지금 이 순간 → <b>está durmiendo</b>."},{"t":"text","q":"Los vegetarianos (no comer) ___ carne.","a":["no comen"],"why":"보편적 사실 → <b>no comen</b>."},{"t":"text","q":"–¿(tú, tocar) ___ algún instrumento? –Sí, toco el violín.","a":["tocas"],"why":"습관·능력 → <b>tocas</b>."},{"t":"text","q":"–¿Qué (cantar) ___ Carlos? –Un tango.","a":["está cantando"],"why":"지금 진행 중 → <b>está cantando</b>."},{"t":"text","q":"(yo, fumar) ___ diez cigarrillos al día, aunque últimamente fumo menos.","a":["fumo"],"why":"습관 → <b>fumo</b>."},{"t":"text","q":"Algunos bebés (llorar) ___ mucho.","a":["lloran"],"why":"일반적 사실 → <b>lloran</b>."}]},{"title":"연습 2. 알맞은 형태 고르기","instr":"알맞은 것을 고르세요.","rule":"진행형을 쓰지 않는 동사에 주의합니다.","items":[{"t":"pick","q":"¿Adónde ___? (ir → 진행형 안 씀)","o":["vais","estáis yendo","oyes","estás oyendo","quieres","estás queriendo","trabajas","estás trabajando","entiendo","estoy entendiendo","vengo","estoy viniendo","veo","estoy viendo"],"a":"vais","why":"ir/venir는 진행형을 쓰지 않음 → vais."},{"t":"pick","q":"¿___ algo? (들리니?)","o":["vais","estáis yendo","oyes","estás oyendo","quieres","estás queriendo","trabajas","estás trabajando","entiendo","estoy entendiendo","vengo","estoy viniendo","veo","estoy viendo"],"a":"oyes","why":"oír(들리다)는 진행형 불가 → oyes."},{"t":"pick","q":"¿Qué ___? (원하다)","o":["vais","estáis yendo","oyes","estás oyendo","quieres","estás queriendo","trabajas","estás trabajando","entiendo","estoy entendiendo","vengo","estoy viniendo","veo","estoy viendo"],"a":"quieres","why":"querer는 진행형 불가."},{"t":"pick","q":"¿En qué ___ ahora? (지금 하는 일 묻기)","o":["vais","estáis yendo","oyes","estás oyendo","quieres","estás queriendo","trabajas","estás trabajando","entiendo","estoy entendiendo","vengo","estoy viniendo","veo","estoy viendo"],"a":"estás trabajando","why":"지금 이 시기 → estás trabajando."},{"t":"pick","q":"No ___. ¿Puedes repetir?","o":["vais","estáis yendo","oyes","estás oyendo","quieres","estás queriendo","trabajas","estás trabajando","entiendo","estoy entendiendo","vengo","estoy viniendo","veo","estoy viendo"],"a":"entiendo","why":"entender는 진행형 불가 → entiendo."},{"t":"pick","q":"Me duele la cabeza. ___ del dentista. (오는 중)","o":["vais","estáis yendo","oyes","estás oyendo","quieres","estás queriendo","trabajas","estás trabajando","entiendo","estoy entendiendo","vengo","estoy viniendo","veo","estoy viendo"],"a":"vengo","why":"venir는 진행형 불가 → vengo."},{"t":"pick","q":"Está muy oscuro. No ___ nada.","o":["vais","estáis yendo","oyes","estás oyendo","quieres","estás queriendo","trabajas","estás trabajando","entiendo","estoy entendiendo","vengo","estoy viniendo","veo","estoy viendo"],"a":"veo","why":"ver(보이다)는 진행형 불가 → veo."}]},{"title":"연습 3. 현재형 / 진행형 쓰기","instr":"괄호 안의 동사를 알맞게 활용하세요.","rule":"진행형을 쓰지 않는 동사: ir, venir, ver, oír, querer, tener 등.","items":[{"t":"text","q":"–¿Adónde (ir) ___? –Voy a casa.","a":["vas"],"why":"ir는 진행형 안 씀 → <b>vas</b>."},{"t":"text","q":"¿(tú, conocer) ___ a esa chica?","a":["conoces"],"why":"conocer는 진행형 불가 → <b>conoces</b>."},{"t":"text","q":"¿Qué (tú, tener) ___ en la mano?","a":["tienes"],"why":"tener → <b>tienes</b>."},{"t":"text","q":"No (oír) ___. Tengo que ir al médico.","a":["oigo"],"why":"oír(들리다) → <b>oigo</b>."},{"t":"text","q":"–¿Puedes ayudarme? –Lo siento. (yo, ver) ___ una película.","a":["estoy viendo"],"why":"mirar의 뜻(영화를 보는 중) → <b>estoy viendo</b>."},{"t":"text","q":"Ángela, ahora te (yo, amar) ___ más que nunca.","a":["amo"],"why":"amar는 진행형 불가 → <b>amo</b>."},{"t":"text","q":"–Tomás está en el salón. (él, oír) ___ la radio. (듣는 중)","a":["está oyendo"],"why":"escuchar의 뜻 → <b>está oyendo</b>."},{"t":"text","q":"¿Qué (vosotros, querer) ___?","a":["queréis"],"why":"querer는 진행형 불가 → <b>queréis</b>."}]}]}];
const SINGLE = 57;
window.__CH = CH;

/* ---------- state ---------- */

const state = {}; // state[ch][key] = value
const marks = {}; // marks[ch][key] = 'ok'|'half'|'bad'
let focusedInput = null;
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },

const progress = () => store.get('gdu-progress') || {};
const total = ch => ch.ex.reduce((n,e)=>n+e.items.length,0);
const fmt = n => (Math.round(n*10)/10).toString();

function speak(t){

}

document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('es')){ e.preventDefault(); speak(e.target.dataset.say);} });

/* ---------- chapter page ---------- */
function chapter(n){
  const c = CH[n-1]; state[n]=state[n]||{}; marks[n]=marks[n]||{};
  const T = total(c);
  const prev = CH[n-2], next = CH[n];
  $('#app').innerHTML = `
  <div class="studybar"><div class="wrap">
    <div class="sb-row">
      <a class="home" href="../">← 전체 단원</a><span class="unit-tag">UNIDAD ${n}</span>
      <span class="sb-spacer"></span>
      <span class="count" id="count">답한 문제 0 / ${T}</span>
      <button class="btn" id="gradeBtn">채점하기</button>
    </div>
    <div class="keys" aria-label="스페인어 특수문자 입력"><span>입력 도우미</span>${['á','é','í','ó','ú','ñ','ü','¿','¡'].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
  </div></div>
  <header class="col ch-head"><div class="no">UNIDAD ${n}</div><h1>${c.es}<small>${c.ko}</small></h1></header>
  <main class="col">
    <section class="theory">${c.theory}</section>
    ${c.ex.map((e,ei)=>exHTML(n,e,ei)).join('')}
    <section class="result" id="result" hidden aria-live="polite"></section>
    <div class="pager">${n>1?`<a href="../Unidad${n-1}/">← Unidad ${n-1}</a>`:'<span></span>'}${n<30?`<a href="../Unidad${n+1}/">Unidad ${n+1} →</a>`:'<span></span>'}</div>
  </main>`;
  // restore state
  c.ex.forEach((e,ei)=>e.items.forEach((it,ii)=>{
    const k=`${ei}-${ii}`, v=state[n][k]; const li=document.getElementById(`i-${k}`);
    if(v!==undefined && v!==''){ if(it.t==='text') li.querySelector('input').value=v; else setPick(li,it,v); }
    if(marks[n][k]) showMark(n,ei,ii);
  }));
  updateCount(n);
  $('#gradeBtn').addEventListener('click',()=>grade(n));
  document.querySelector('.keys').addEventListener('mousedown',e=>{ if(e.target.dataset.k) e.preventDefault(); });
  document.querySelector('.keys').addEventListener('click',e=>{
    const k=e.target.dataset.k; if(!k) return;
    const inp = focusedInput && document.body.contains(focusedInput) ? focusedInput : null;
    if(!inp) return;
    const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s;
    inp.value=inp.value.slice(0,s)+k+inp.value.slice(en); inp.setSelectionRange(s+1,s+1); inp.focus();
    inp.dispatchEvent(new Event('input',{bubbles:true}));
  });
  if(Object.keys(lastResult[n]||{}).length) renderResult(n,false);
}
const lastResult = {};

function exHTML(n,e,ei){
  return `<section class="ex" id="ex${ei}">
    <div class="ex-head"><h2>${e.title}</h2><span class="ex-score" id="sc${ei}"></span></div>
    <p class="instr">${e.instr}</p>
    <ol class="items">${e.items.map((it,ii)=>{
      const k=`${ei}-${ii}`; const [a,b]=it.q.split('___');
      const body = it.t==='text'
        ? `${a}<input type="text" id="in-${n}-${k}" data-k="${k}" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="${ii+1}번 답">${b||''}`
        : `${a}<span class="blank" id="bl-${n}-${k}"></span>${b||''}<div class="opts" role="radiogroup" aria-label="${ii+1}번 선택지">${it.o.map(o=>`<button type="button" role="radio" aria-checked="false" data-k="${k}" data-v="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div>`;
      return `<li class="item" id="i-${k}"><span class="n">${ii+1}</span><div class="q">${body}</div><div class="fb" id="fb-${k}"></div></li>`;
    }).join('')}</ol></section>`;
}

function setPick(li,it,v){
  li.querySelector('.blank').textContent=v;
  li.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked',b.dataset.v===v?'true':'false'));
}
function clearMark(n,k){
  delete marks[n][k]; const li=document.getElementById('i-'+k); if(!li) return;
  li.classList.remove('ok','bad','half'); document.getElementById('fb-'+k).innerHTML='';
}
function updateCount(n){
  const c=CH[n-1]; let a=0; c.ex.forEach((e,ei)=>e.items.forEach((it,ii)=>{ const v=state[n][`${ei}-${ii}`]; if(v!==undefined&&v!=='') a++; }));
  const el=$('#count'); if(el) el.textContent=`답한 문제 ${a} / ${total(c)}`; return a;
}

document.addEventListener('focusin',e=>{ if(e.target.matches && e.target.matches('.q input')) focusedInput=e.target; });
document.addEventListener('input',e=>{
  const t=e.target; if(!t.matches||!t.matches('.q input')) return;
  const n=curChapter(); const k=t.dataset.k; state[n][k]=t.value; clearMark(n,k); updateCount(n);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.opts button'); if(!b) return;
  const n=curChapter(); const k=b.dataset.k; const [ei,ii]=k.split('-').map(Number); const it=CH[n-1].ex[ei].items[ii];
  state[n][k]=b.dataset.v; setPick(document.getElementById('i-'+k),it,b.dataset.v); clearMark(n,k); updateCount(n);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.matches && e.target.matches('.q input')){
    const ins=[...document.querySelectorAll('.q input')]; const i=ins.indexOf(e.target); if(ins[i+1]) ins[i+1].focus();
  }
});
const curChapter = () => SINGLE;

/* ---------- grading ---------- */
const strip = s => s.replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm = s => s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');
function judge(it,v){
  if(v===undefined||v==='') return 'none';
  if(it.t==='pick') return v===it.a?'ok':'bad';
  const x=norm(v);
  if(it.a.some(a=>norm(a)===x)) return 'ok';
  if(it.a.some(a=>strip(norm(a))===strip(x))) return 'half';
  return 'bad';
}
function showMark(n,ei,ii){
  const k=`${ei}-${ii}`, it=CH[n-1].ex[ei].items[ii], m=marks[n][k], li=document.getElementById('i-'+k), fb=document.getElementById('fb-'+k);
  li.classList.remove('ok','bad','half'); if(!m) return; li.classList.add(m);
  const ans = it.t==='pick'?it.a:it.a[0]; const rule = CH[n-1].ex[ei].rule;
  const why = it.why||rule;
  const head = m==='ok'?'✔ 정답':m==='half'?`△ 악센트(´) 확인 · 정답 <b>${ans}</b> (0.5점)`:`✘ 오답 · 정답 <b>${ans}</b>`;
  fb.innerHTML = head + (why?`<span class="why"><b>해설</b> ${why}</span>`:'');
}
function grade(n){
  const c=CH[n-1]; const res={ex:[],score:0,total:0,blank:0};
  c.ex.forEach((e,ei)=>{
    let s=0;
    e.items.forEach((it,ii)=>{
      const k=`${ei}-${ii}`, j=judge(it,state[n][k]);
      if(j==='none'){ marks[n][k]='bad'; res.blank++; } else marks[n][k]=j;
      if(j==='ok') s+=1; else if(j==='half') s+=.5;
      showMark(n,ei,ii);
      if(j==='none'){ document.getElementById('fb-'+k).innerHTML='✘ 미응답 · 정답 <b>'+(it.t==='pick'?it.a:it.a[0])+'</b>'+`<span class="why"><b>해설</b> ${it.why||e.rule}</span>`; }
    });
    document.getElementById('sc'+ei).textContent=`${fmt(s)} / ${e.items.length}`;
    res.ex.push({title:e.title,s,t:e.items.length}); res.score+=s; res.total+=e.items.length;
  });
  lastResult[n]=res;
  const pr=progress(); const old=pr['ch'+n];
  if(!old||res.score>=old.score){ pr['ch'+n]={score:res.score,total:res.total}; store.set('gdu-progress',pr); }
  renderResult(n,true);
}
function renderResult(n,scroll){
  const res=lastResult[n], pct=Math.round(res.score/res.total*100), name=(store.get('gdu-name')||'').trim();
  const msg = pct>=90?['훌륭해요!','거의 완벽합니다. 다음 단원으로 넘어가도 좋아요.']:pct>=70?['잘했어요!','틀린 문제의 해설을 읽고 다시 도전해 보세요.']:pct>=50?['조금만 더!','문법 정리를 한 번 더 읽고 틀린 문제를 다시 풀어 보세요.']:['다시 도전해요','문법 정리를 천천히 읽고 예문을 소리 내어 따라 해 보세요.'];
  const R=54, C=2*Math.PI*R;
  const el=$('#result'); el.hidden=false;
  el.innerHTML=`
   <div class="r-top">
    <div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle class="bg" cx="66" cy="66" r="${R}"/><circle class="fg" cx="66" cy="66" r="${R}" stroke-dasharray="${C*pct/100} ${C}"/></svg><b>${pct}%</b></div>
    <div class="r-txt"><div class="eyebrow">${name?name+' · ':''}UNIDAD ${n} 결과</div><h2>${fmt(res.score)} / ${res.total}점 · ${msg[0]}</h2><p>${msg[1]}</p>${res.blank?`<p>풀지 않은 문제가 ${res.blank}개 있어요. 오답으로 처리되었습니다.</p>`:''}</div>
   </div>
   <div class="brk">${res.ex.map(e=>`<div><span>${e.title}</span><span class="bar"><i style="width:${e.s/e.t*100}%"></i></span><span>${fmt(e.s)}/${e.t}</span></div>`).join('')}</div>
   <div class="r-act"><button class="btn" id="retryWrong">틀린 문제만 다시 풀기</button><button class="btn ghost" id="retryAll">처음부터 다시 풀기</button></div>`;
  $('#retryWrong').onclick=()=>retry(n,false); $('#retryAll').onclick=()=>retry(n,true);
  if(scroll) el.scrollIntoView({behavior:'smooth',block:'center'});
}
function retry(n,all){
  const c=CH[n-1];
  c.ex.forEach((e,ei)=>e.items.forEach((it,ii)=>{
    const k=`${ei}-${ii}`, m=marks[n][k];
    if(all || m!=='ok'){
      delete state[n][k]; clearMark(n,k); const li=document.getElementById('i-'+k);
      if(it.t==='text') li.querySelector('input').value=''; else { li.querySelector('.blank').textContent=''; li.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked','false')); }
    }
  }));
  c.ex.forEach((e,ei)=>{ $('#sc'+ei).textContent=''; });
  delete lastResult[n]; $('#result').hidden=true; updateCount(n);
  const first=document.querySelector('li.item:not(.ok)'); if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); else window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- router ---------- */
function route(){
  chapter(SINGLE);
  window.scrollTo(0,0);
}
route();
</script>
