<style>
/* Layout: sticky study bar + single reading column; main page is a chapter grid with a 3-step method strip */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#172033; --muted:#5B6679; --line:#DDE2EC;
  --accent:#B8283F; --accent-ink:#FFFFFF; --accent-soft:#FBE4E8;
  --gold:#F2B705; --gold-soft:#FFF3C4; --chip:#E8EDF6;
  --ok:#12805C; --ok-soft:#DDF4EA; --bad:#C0302B; --bad-soft:#FDE3E1; --half:#8A5600; --half-soft:#FFF0CC;
  --f-display:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#182033; --ink:#ECEFF6; --muted:#9AA6BC; --line:#2A3550;
  --accent:#F0627A; --accent-ink:#1A0509; --accent-soft:#3B1A24; --gold:#F2B705; --gold-soft:#3A3010; --chip:#222C45;
  --ok:#4FD1A0; --ok-soft:#12382D; --bad:#FF7A74; --bad-soft:#43201F; --half:#F2B705; --half-soft:#3A3010; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#182033; --ink:#ECEFF6; --muted:#9AA6BC; --line:#2A3550;
  --accent:#F0627A; --accent-ink:#1A0509; --accent-soft:#3B1A24; --gold:#F2B705; --gold-soft:#3A3010; --chip:#222C45;
  --ok:#4FD1A0; --ok-soft:#12382D; --bad:#FF7A74; --bad-soft:#43201F; --half:#F2B705; --half-soft:#3A3010; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin-inline:auto;padding-inline:16px}
.col{max-width:780px;margin-inline:auto;padding-inline:16px}
.es{font-style:italic;font-weight:500;cursor:pointer;border-bottom:1.5px dotted var(--accent);white-space:normal}
.es:hover{background:var(--accent-soft)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ===== main ===== */
.hero{padding-block:48px 28px}
.hero h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:60ch;color:var(--muted);margin:14px 0 0}
.who{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:24px}
.who label{font-weight:700;font-size:.9rem}
.who input{font:inherit;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:min(100%,260px)}
.overall{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;min-width:120px;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-block:8px 36px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--gold-soft);border-radius:14px;padding:14px 16px;font-size:.92rem}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#241a00;font-weight:800;margin-right:8px;font-family:var(--f-display)}
.steps b{display:inline}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding-bottom:48px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;transition:transform .15s,box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,30,60,.12)}
.card .no{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--accent)}
.card h2{font-size:1.35rem;font-style:italic}
.card .ko{font-weight:700}
.card .desc{color:var(--muted);font-size:.9rem;flex:1}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.card .go{font-weight:700;color:var(--accent)}
.card.soon{background:transparent;border-style:dashed;justify-content:center;color:var(--muted);pointer-events:none}
footer.site{padding-block:0 48px;color:var(--muted);font-size:.84rem}

/* ===== chapter ===== */
.studybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.sb-row{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.home{text-decoration:none;font-weight:700;font-size:.92rem;padding:6px 10px;border-radius:8px;background:var(--chip)}
.tabs{display:flex;gap:6px}
.tabs a{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;text-decoration:none;font-weight:700;font-family:var(--f-display);background:var(--chip)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.sb-spacer{flex:1}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:hover{filter:brightness(1.07)}
.keys{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.keys button{min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.keys span{font-size:.78rem;color:var(--muted);align-self:center;margin-right:4px}

.ch-head{padding-block:36px 12px}
.ch-head .no{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1rem;letter-spacing:.1em}
.ch-head h1{font-size:clamp(2rem,6vw,3rem);font-style:italic;font-weight:800;margin-top:4px}
.ch-head h1 small{display:block;font-size:.5em;font-style:normal;font-weight:500;color:var(--muted);margin-top:4px}
section.theory{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-block:18px}
section.theory h2{font-size:1.3rem;margin-bottom:10px}
section.theory h3{font-size:1.05rem;margin:22px 0 8px}
section.theory p{margin:8px 0}
.tip{font-size:.84rem;color:var(--muted);margin:0 0 4px}
.tw{overflow-x:auto;margin-block:10px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem}
th{background:var(--accent);color:var(--accent-ink);text-align:left;padding:8px 12px;font-size:.85rem}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.note{border-radius:12px;padding:12px 14px;margin-block:12px;font-size:.95rem}
.note.warn{background:var(--gold-soft)}
.note.pero{background:var(--accent-soft)}
.note b.lab{font-family:var(--f-display);letter-spacing:.06em;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:8px}
.chips .es{background:var(--chip);border:0;padding:3px 10px;border-radius:99px}
ul.rules{padding-left:1.2em;margin:8px 0}
ul.rules li{margin-block:4px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-block:18px}
.ex-head{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.ex-head h2{font-size:1.2rem}
.ex-score{font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ex p.instr{margin:0 0 14px;color:var(--muted);font-size:.93rem}
ol.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
li.item{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;min-width:0;align-items:start}
li.item .n{font-size:.8rem;font-weight:700;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.q{min-width:0;overflow-wrap:anywhere}
.q input{font:inherit;font-style:italic;width:9.5em;max-width:100%;padding:3px 8px;margin-inline:4px;border:0;border-bottom:2px solid var(--accent);background:var(--chip);color:var(--ink);border-radius:6px 6px 0 0}
.blank{display:inline-block;min-width:3.4em;text-align:center;margin-inline:4px;padding:0 8px;border-bottom:2px solid var(--accent);background:var(--chip);border-radius:6px 6px 0 0;font-style:italic;font-weight:500;min-height:1.5em;vertical-align:bottom}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opts button{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:3px 12px;font-style:italic;font-size:.95rem}
.opts button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb{font-size:.86rem;margin-top:6px;grid-column:2}
li.item.ok{border-color:var(--ok);background:var(--ok-soft)}
li.item.bad{border-color:var(--bad);background:var(--bad-soft)}
li.item.half{border-color:var(--half);background:var(--half-soft)}
li.item.ok .fb{color:var(--ok)} li.item.bad .fb{color:var(--bad)} li.item.half .fb{color:var(--half)}
.fb b{font-style:italic}
.fb .why{display:block;color:var(--ink);opacity:.85;margin-top:4px;line-height:1.55}.fb .why b{font-style:normal;font-family:var(--f-display);font-size:.78rem;letter-spacing:.05em;color:var(--muted);margin-right:4px}.unit-tag{font-family:var(--f-display);font-weight:800;color:var(--accent)}

.result{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:24px;margin-block:24px}
.result[hidden]{display:none}
.r-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--chip)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .8s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.9rem;font-weight:800}
.r-txt{min-width:0;flex:1}
.r-txt h2{font-size:1.6rem}
.r-txt p{margin:6px 0;color:var(--muted)}
.brk{margin-top:18px;display:grid;gap:8px}
.brk div{display:grid;grid-template-columns:minmax(0,1fr) 90px 60px;gap:10px;align-items:center;font-size:.9rem}
.brk .bar{min-width:0}
.brk span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.r-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 56px}
.pager a{text-decoration:none;font-weight:700;padding:12px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
@media (max-width:520px){ol.items{grid-template-columns:1fr}.brk div{grid-template-columns:minmax(0,1fr) 60px 52px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const E = t => `<span class="es" role="button" tabindex="0" data-say="${t.replace(/"/g,'&quot;')}">${t}</span>`;
const chips = arr => `<div class="chips">${arr.map(E).join('')}</div>`;
const tbl = (head, rows) => `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const warn = h => `<div class="note warn"><b class="lab">ATENCIÓN</b>${h}</div>`;
const pero = h => `<div class="note pero"><b class="lab">PERO</b>${h}</div>`;
const ELLA = ['el','la'];
const pk = (q,o,a,why) => ({t:'pick',q,o,a,why});
const tx = (q,a,why) => ({t:'text',q,a:Array.isArray(a)?a:[a],why});

const X = (title,instr,rule,items) => ({title,instr,rule,items});
const P = (o,rows) => rows.map(r=>pk(r[0],o,r[1],r[2]));
const T = rows => rows.map(r=>tx(r[0],r[1],r[2]));
const DEF = ['el','la','los','las'];
const INDEF = ['un','una','unos','unas'];

const CH = [null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,{"id":23,"es":"todo, toda, todos, todas","ko":"부정어 (1) todo","desc":"todo/toda/todos/todas의 형태와 쓰임, todo el día / todos los días의 차이, todo el mundo를 배웁니다.","theory":"\n<h2>핵심 정리</h2>\n<p class=\"tip\">🔊 예문을 누르면 발음을 들을 수 있어요.</p>\n<p><b>todo, toda, todos, todas</b>는 \"전체, 모두\"를 뜻합니다. 뒤 명사의 성·수에 일치합니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se han comido toda la tarta.\">Se han comido toda la tarta.</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todas las tartas cuestan 12 euros.\">Todas las tartas cuestan 12 euros.</span></p>\n<ul class=\"rules\">\n<li><b>todo / toda</b> = 하나(단수)의 <b>전체</b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Toda mi familia.\">Toda mi familia.</span> (내 가족 전체) · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer estuve en casa todo el día.\">Ayer estuve en casa todo el día.</span> (하루 종일)</li>\n<li><b>todos / todas</b> = 여러 개(복수)의 <b>전부</b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todos mis amigos hablan español.\">Todos mis amigos hablan español.</span></li>\n</ul>\n<div class=\"tw\"><table><thead><tr><th>형태</th><th>뒤에 오는 명사</th><th>예</th></tr></thead><tbody><tr><td><b>todo</b> + el / mi, tu, nuestro… / este, ese</td><td>남성 단수</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He trabajado todo el día.\">He trabajado todo el día.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hemos perdido todo nuestro dinero.\">Hemos perdido todo nuestro dinero.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿De quién es todo ese dinero?\">¿De quién es todo ese dinero?</span></td></tr><tr><td><b>toda</b> + la / mi, tu, nuestra… / esta, esa</td><td>여성 단수</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He dormido toda la noche.\">He dormido toda la noche.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Anoche salí con toda mi clase.\">Anoche salí con toda mi clase.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿De dónde es toda esa gente?\">¿De dónde es toda esa gente?</span></td></tr><tr><td><b>todos</b> + los / mis, tus, nuestros… / estos, esos</td><td>남성 복수</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Voy a México todos los veranos.\">Voy a México todos los veranos.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tira todos esos papeles.\">Tira todos esos papeles.</span></td></tr><tr><td><b>todas</b> + las / mis, tus, nuestras… / estas, esas</td><td>여성 복수</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Voy al gimnasio todas las tardes.\">Voy al gimnasio todas las tardes.</span><br><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Conozco a todas esas chicas.\">Conozco a todas esas chicas.</span></td></tr></tbody></table></div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN</b><b>todo el día</b> = 하루 종일(그 하루 전체) ↔ <b>todos los días</b> = 매일. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer no salí. Estuve en casa todo el día.\">Ayer no salí. Estuve en casa todo el día.</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Toco el piano todos los días.\">Toco el piano todos los días.</span><br><b>todo el libro</b> = 책 한 권 전체 ↔ <b>todos los libros</b> = 모든 책. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He leído todo el libro.\">He leído todo el libro.</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gustan todos los libros.\">Me gustan todos los libros.</span></div>\n<ul class=\"rules\">\n<li>todo 뒤에는 반드시 <b>관사·소유사·지시사</b>가 와야 합니다: ✗ <i>todo día</i> → ✓ <b>todo el día</b>.</li>\n<li>명사가 분명하면 <b>todo, todos, todas</b> 단독 사용: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No hay pan. Te lo has comido todo.\">No hay pan. Te lo has comido todo.</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nicolás tiene tres hermanas y son todas muy simpáticas.\">Nicolás tiene tres hermanas y son todas muy simpáticas.</span></li>\n<li><b>todo</b> = todas las cosas (모든 것): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"–¿Qué te gusta más de España? –Todo.\">–¿Qué te gusta más de España? –Todo.</span></li>\n<li><b>todo el mundo</b>, <b>todos / todas</b> = 모든 사람: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A todo el mundo le gusta París.\">A todo el mundo le gusta París.</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En mi clase, todos somos buenos estudiantes.\">En mi clase, todos somos buenos estudiantes.</span></li>\n</ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN</b><b>todo el mundo</b>는 단수 취급 → 동사는 <b>단수</b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todo el mundo quiere ser feliz.\">Todo el mundo quiere ser feliz.</span><br><b>todos / todas</b>는 복수 취급 → 동사는 <b>복수</b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todos queremos ser felices.\">Todos queremos ser felices.</span></div>","ex":[{"title":"연습 1. todo, toda, todos, todas","instr":"빈칸에 알맞은 형태를 고르세요.","rule":"뒤 명사의 성·수(남/여, 단/복)를 먼저 확인합니다. 단수(하나의 전체)는 todo/toda, 복수(여럿 전부)는 todos/todas입니다.","items":[{"t":"pick","q":"Sofía no está bien. Ayer estuvo en la cama ___ el día.","o":["todo","toda","todos","todas"],"a":"todo","why":"día는 남성 단수, \"하루 종일\" → <b>todo el día</b>."},{"t":"pick","q":"No he visto a Luis en ___ la semana.","o":["todo","toda","todos","todas"],"a":"toda","why":"semana는 여성 단수, \"일주일 내내\" → <b>toda la semana</b>."},{"t":"pick","q":"Voy al cine ___ las semanas.","o":["todo","toda","todos","todas"],"a":"todas","why":"\"매주\"는 복수 → <b>todas las semanas</b>. (toda la semana = 일주일 내내와 의미 차이)"},{"t":"pick","q":"Conozco ___ las canciones de Aute.","o":["todo","toda","todos","todas"],"a":"todas","why":"canciones는 여성 복수 → <b>todas las canciones</b>."},{"t":"pick","q":"___ mis hermanas viven en Caracas.","o":["todo","toda","todos","todas"],"a":"todas","why":"hermanas는 여성 복수 → <b>todas mis hermanas</b>."},{"t":"pick","q":"Vamos al campo ___ los fines de semana.","o":["todo","toda","todos","todas"],"a":"todos","why":"fines는 남성 복수 → <b>todos los fines de semana</b>."},{"t":"pick","q":"Hemos visto ___ el museo.","o":["todo","toda","todos","todas"],"a":"todo","why":"museo는 남성 단수, \"박물관 전체\" → <b>todo el museo</b>."},{"t":"pick","q":"He ordenado ___ mis cedés.","o":["todo","toda","todos","todas"],"a":"todos","why":"cedés는 남성 복수 → <b>todos mis cedés</b>."},{"t":"pick","q":"Sé ___ esa canción de memoria.","o":["todo","toda","todos","todas"],"a":"toda","why":"canción은 여성 단수 → <b>toda esa canción</b> (그 노래 전부)."},{"t":"pick","q":"Ha llovido poco por ___ la zona.","o":["todo","toda","todos","todas"],"a":"toda","why":"zona는 여성 단수 → <b>toda la zona</b>."},{"t":"pick","q":"___ las casas del pueblo son antiguas.","o":["todo","toda","todos","todas"],"a":"todas","why":"casas는 여성 복수 → <b>todas las casas</b>."},{"t":"pick","q":"¿De quién son ___ esos libros?","o":["todo","toda","todos","todas"],"a":"todos","why":"libros는 남성 복수 → <b>todos esos libros</b>."}]},{"title":"연습 2. todo + 관사 + 명사","instr":"( ) 안의 명사를 todo/toda/todos/todas와 정관사(el, la, los, las)를 써서 알맞게 바꿔 쓰세요.","rule":"\"todo/a/os/as + 관사 + 명사\" 구조입니다. todo와 관사 모두 명사의 성·수에 일치해야 합니다. 예: todas las cajas.","items":[{"t":"text","q":"(cajas) ___ están vacías.","a":["todas las cajas"],"why":"cajas는 여성 복수 → <b>todas las cajas</b>."},{"t":"text","q":"(tarta) Se han comido ___.","a":["toda la tarta"],"why":"tarta는 여성 단수 → <b>toda la tarta</b> (케이크 전체)."},{"t":"text","q":"(niños) ___ están contentos.","a":["todos los niños"],"why":"niños는 남성 복수 → <b>todos los niños</b>."},{"t":"text","q":"(leche) ___ está en la nevera.","a":["toda la leche"],"why":"leche는 여성 단수 → <b>toda la leche</b>."},{"t":"text","q":"(tiendas) ___ están cerradas.","a":["todas las tiendas"],"why":"tiendas는 여성 복수 → <b>todas las tiendas</b>."},{"t":"text","q":"(dinero) Se ha gastado ___.","a":["todo el dinero"],"why":"dinero는 남성 단수 → <b>todo el dinero</b>."},{"t":"text","q":"(queso) Me he comido ___.","a":["todo el queso"],"why":"queso는 남성 단수 → <b>todo el queso</b>."},{"t":"text","q":"(bolsillos) Tiene dinero en ___.","a":["todos los bolsillos"],"why":"bolsillos는 남성 복수 → <b>todos los bolsillos</b>."}]},{"title":"연습 3. todo + 소유사","instr":"( ) 안의 명사와 소유사를 써서 알맞게 바꿔 쓰세요. (todo + 소유사 + 명사)","rule":"소유사 앞에는 정관사가 필요 없습니다. todo/소유사/명사 3개 모두 성·수가 일치해야 합니다. 예: toda tu familia.","items":[{"t":"text","q":"Conozco a ___ , Pedro. (tu familia)","a":["toda tu familia"],"why":"familia는 여성 단수 → <b>toda tu familia</b>."},{"t":"text","q":"___ están ya en el coche, don Manuel. (sus maletas)","a":["todas sus maletas"],"why":"maletas는 여성 복수 → <b>todas sus maletas</b>."},{"t":"text","q":"Lucas gasta ___ en novelas. (su dinero)","a":["todo su dinero"],"why":"dinero는 남성 단수 → <b>todo su dinero</b>."},{"t":"text","q":"¿Dónde están ___, Srta. Hernández? (sus alumnos)","a":["todos sus alumnos"],"why":"alumnos는 남성 복수 → <b>todos sus alumnos</b>."},{"t":"text","q":"___ me quieren mucho. (mis amigos)","a":["todos mis amigos"],"why":"amigos는 남성 복수 → <b>todos mis amigos</b>."},{"t":"text","q":"¿Dónde están ___, Sr. Ramírez? (sus hijos)","a":["todos sus hijos"],"why":"hijos는 남성 복수 → <b>todos sus hijos</b>."},{"t":"text","q":"Pedro pasa ___ en la playa. (sus vacaciones)","a":["todas sus vacaciones"],"why":"vacaciones는 여성 복수 → <b>todas sus vacaciones</b>."},{"t":"text","q":"___ somos simpáticos. (nuestros vecinos)","a":["todos nuestros vecinos"],"why":"vecinos는 남성 복수 → <b>todos nuestros vecinos</b>."}]},{"title":"연습 4. 명사 없이 쓰는 todo","instr":"앞 문장에서 가리키는 대상에 맞게 todo, toda, todos, todas 중 하나를 고르세요.","rule":"명사를 생략하고 단독으로 쓸 때도 가리키는 대상의 성·수에 일치합니다. \"todo\"는 \"모든 것\"일 때도 쓰입니다.","items":[{"t":"pick","q":"Me encantan las mariposas. ___ tienen alas muy bonitas.","o":["todo","toda","todos","todas"],"a":"todas","why":"mariposas(여성 복수) → <b>todas</b>."},{"t":"pick","q":"¿Dónde están tus hermanos? –Están ___ en el jardín.","o":["todo","toda","todos","todas"],"a":"todos","why":"hermanos(남성 복수) → <b>todos</b>."},{"t":"pick","q":"¿Dónde está la tarta? –Se la han comido ___.","o":["todo","toda","todos","todas"],"a":"toda","why":"tarta(여성 단수) → <b>toda</b>."},{"t":"pick","q":"¿Qué libro prefieres? –Es igual. Me gustan ___.","o":["todo","toda","todos","todas"],"a":"todos","why":"libros(남성 복수) → <b>todos</b>."},{"t":"pick","q":"No hay leche. Se la han bebido ___.","o":["todo","toda","todos","todas"],"a":"toda","why":"leche(여성 단수), la가 이를 받음 → <b>toda</b>."},{"t":"pick","q":"No tengo dinero. Lo he perdido ___.","o":["todo","toda","todos","todas"],"a":"todo","why":"dinero(남성 단수), lo가 이를 받음 → <b>todo</b>."},{"t":"pick","q":"Nicolás tiene tres hermanas y son ___ muy simpáticas.","o":["todo","toda","todos","todas"],"a":"todas","why":"hermanas(여성 복수) → <b>todas</b>."},{"t":"pick","q":"No hay pan. Te lo has comido ___.","o":["todo","toda","todos","todas"],"a":"todo","why":"pan(남성 단수) → <b>todo</b>."}]},{"title":"연습 5. todo, todos, todas, todo el mundo","instr":"알맞은 표현을 고르세요.","rule":"모든 사람을 가리킬 때: todo el mundo(단수 동사), todos/todas(복수 동사). 모든 것은 todo.","items":[{"t":"pick","q":"Lo sé ___.","o":["todo","todos","todas","todo el mundo"],"a":"todo","why":"\"모든 것\" → <b>todo</b>."},{"t":"pick","q":"___ somos altas.","o":["todo","todos","todas","todo el mundo"],"a":"todas","why":"1인칭 복수(우리), 여성들 → <b>todas</b>."},{"t":"pick","q":"___ buscamos la felicidad.","o":["todo","todos","todas","todo el mundo"],"a":"todos","why":"동사 buscamos(복수) → <b>todos</b>. (todo el mundo + 3인칭 단수 buscamos ✗)"},{"t":"pick","q":"___ quiere a Marta.","o":["todo","todos","todas","todo el mundo"],"a":"todo el mundo","why":"동사 quiere(3인칭 단수) → <b>todo el mundo</b>."},{"t":"pick","q":"___ ha venido a la fiesta.","o":["todo","todos","todas","todo el mundo"],"a":"todo el mundo","why":"동사 ha venido(단수) → <b>todo el mundo</b>."},{"t":"pick","q":"___ es más barato en esta tienda.","o":["todo","todos","todas","todo el mundo"],"a":"todo","why":"\"모든 것\" → <b>todo</b>."},{"t":"pick","q":"___ están de acuerdo conmigo.","o":["todo","todos","todas","todo el mundo"],"a":"todos","why":"동사 están(복수) → <b>todos</b>."},{"t":"pick","q":"Conozco algunas calles del pueblo, no ___.","o":["todo","todos","todas","todo el mundo"],"a":"todas","why":"calles(여성 복수) → <b>todas</b> (생략된 las calles)."},{"t":"pick","q":"Somos cuatro hermanos y ___ somos rubios.","o":["todo","todos","todas","todo el mundo"],"a":"todos","why":"1인칭 복수 → <b>todos</b>."},{"t":"pick","q":"Francisco es muy egoísta. Lo quiere ___ para él.","o":["todo","todos","todas","todo el mundo"],"a":"todo","why":"\"모든 것\" → <b>todo</b>."}]},{"title":"연습 6. todo el / todos los","instr":"의미에 알맞은 표현을 고르세요.","rule":"단수(todo el día)는 \"그 하루 전체\", 복수(todos los días)는 \"매일\"입니다.","items":[{"t":"pick","q":"\"매일 피아노를 칩니다\": Toco el piano ___.","o":["todo el día","todos los días","toda la día"],"a":"todos los días","why":"\"매일\" → <b>todos los días</b>."},{"t":"pick","q":"\"어제 종일 집에 있었다\": Ayer estuve en casa ___.","o":["todos los días","todo el día","todo día"],"a":"todo el día","why":"\"하루 종일\" → <b>todo el día</b>."},{"t":"pick","q":"\"모든 책이 마음에 든다\": Me gustan ___.","o":["todo el libro","todos los libros","todos libros"],"a":"todos los libros","why":"복수 → <b>todos los libros</b>."},{"t":"pick","q":"\"책 한 권을 다 읽었다\": He leído ___.","o":["todo el libro","todos los libros","toda el libro"],"a":"todo el libro","why":"단수(한 권 전체) → <b>todo el libro</b>."},{"t":"pick","q":"\"매 여름 멕시코에 간다\": Voy a México ___.","o":["todo el verano","todos los veranos","todas los veranos"],"a":"todos los veranos","why":"\"매 여름\" → <b>todos los veranos</b>."},{"t":"pick","q":"\"밤새 잤다\": He dormido ___.","o":["toda la noche","todas las noches","todo la noche"],"a":"toda la noche","why":"단수 \"밤 내내\" → <b>toda la noche</b>."}]}]}];

  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },

};

}
document.addEventListener('click',e=>{ const s=e.target.closest('.es'); if(s) speak(s.dataset.say); });

/* ---------- chapter page ---------- */
function chapter(n){
  const c = CH[n-1]; state[n]=state[n]||{}; marks[n]=marks[n]||{};
  const T = total(c);
  const prev = CH[n-2], next = CH[n];
  $('#app').innerHTML = `
  <div class="studybar"><div class="wrap">
    <div class="sb-row">
      <a class="home" href="../">← 전체 단원</a><span class="unit-tag">UNIDAD ${n}</span>
      <span class="sb-spacer"></span>
      <span class="count" id="count">답한 문제 0 / ${T}</span>
      <button class="btn" id="gradeBtn">채점하기</button>
    </div>
    <div class="keys" aria-label="스페인어 특수문자 입력"><span>입력 도우미</span>${['á','é','í','ó','ú','ñ','ü','¿','¡'].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
  </div></div>
  <header class="col ch-head"><div class="no">UNIDAD ${n}</div><h1>${c.es}<small>${c.ko}</small></h1></header>
  <main class="col">
    <section class="theory">${fmtTheory(c.theory)}</section>
    ${c.ex.map((e,ei)=>exHTML(n,e,ei)).join('')}
    <section class="result" id="result" hidden aria-live="polite"></section>
    <div class="pager">${n>1?`<a href="../Unidad${n-1}/">← Unidad ${n-1}</a>`:'<span></span>'}${n<30?`<a href="../Unidad${n+1}/">Unidad ${n+1} →</a>`:'<span></span>'}</div>
  </main>`;
  // restore state
  c.ex.forEach((e,ei)=>e.items.forEach((it,ii)=>{
    const k=`${ei}-${ii}`, v=state[n][k]; const li=document.getElementById(`i-${k}`);
    if(v!==undefined && v!==''){ if(it.t==='text') li.querySelector('input').value=v; else setPick(li,it,v); }
    if(marks[n][k]) showMark(n,ei,ii);
  }));
  updateCount(n);
  $('#gradeBtn').addEventListener('click',()=>grade(n));
  document.querySelector('.keys').addEventListener('mousedown',e=>{ if(e.target.dataset.k) e.preventDefault(); });
  document.querySelector('.keys').addEventListener('click',e=>{
    const k=e.target.dataset.k; if(!k) return;
    const inp = focusedInput && document.body.contains(focusedInput) ? focusedInput : null;
    if(!inp) return;
    const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s;
    inp.value=inp.value.slice(0,s)+k+inp.value.slice(en); inp.setSelectionRange(s+1,s+1); inp.focus();
    inp.dispatchEvent(new Event('input',{bubbles:true}));
  });
  if(Object.keys(lastResult[n]||{}).length) renderResult(n,false);
}
const lastResult = {};

const NOBREAK='(?<!\\bSra?)(?<!\\bDra?)(?<!\\bSrta)(?<!\\bUds?)(?<!\\bEE)';
function fmtQ(s){
  if(!s) return s;
  s=s.replace(/ (?=–)/g,'<br>');
  s=s.replace(new RegExp('(?<![A-Za-z]\\.[A-Z])'+NOBREAK+'([.!?…])\\s+(?=[¿¡A-ZÁÉÍÓÚÑ(\\[])','g'),'$1<br>');
  return s;
}
function fmtTheory(h){
  const ES='<span class="es"';
  h=h.replace(/<\/span>(?:\s*[·\/]\s*|\s+)(?=<span class=\"es\")/g,'</span><br>');
  h=h.replace(/(<span class="es"[^>]*>)([^<]*)(<\/span>)/g,(m,a,t,c)=>a+fmtQ(t)+c);
  h=h.replace(/(<br>)\s*(<br>)/g,'$1');
  h=h.replace(/(:\s*)(<span class="es"[^>]*>[^<]*<\/span><br><span class="es")/g,'$1<br>$2');
  return h;
}
function exHTML(n,e,ei){
  return `<section class="ex" id="ex${ei}">
    <div class="ex-head"><h2>${e.title}</h2><span class="ex-score" id="sc${ei}"></span></div>
    <p class="instr">${e.instr}</p>
    <ol class="items">${e.items.map((it,ii)=>{
      const k=`${ei}-${ii}`; const [a,b]=it.q.split('___').map(fmtQ);
      const body = it.t==='text'
        ? `${a}<input type="text" id="in-${n}-${k}" data-k="${k}" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="${ii+1}번 답">${b||''}`
        : `${a}<span class="blank" id="bl-${n}-${k}"></span>${b||''}<div class="opts" role="radiogroup" aria-label="${ii+1}번 선택지">${it.o.map(o=>`<button type="button" role="radio" aria-checked="false" data-k="${k}" data-v="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div>`;
      return `<li class="item" id="i-${k}"><span class="n">${ii+1}</span><div class="q">${body}</div><div class="fb" id="fb-${k}"></div></li>`;
    }).join('')}</ol></section>`;
}

function setPick(li,it,v){
  li.querySelector('.blank').textContent=v;
  li.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked',b.dataset.v===v?'true':'false'));
}
function clearMark(n,k){
  delete marks[n][k]; const li=document.getElementById('i-'+k); if(!li) return;
  li.classList.remove('ok','bad','half'); document.getElementById('fb-'+k).innerHTML='';
}
function updateCount(n){
  const c=CH[n-1]; let a=0; c.ex.forEach((e,ei)=>e.items.forEach((it,ii)=>{ const v=state[n][`${ei}-${ii}`]; if(v!==undefined&&v!=='') a++; }));
  const el=$('#count'); if(el) el.textContent=`답한 문제 ${a} / ${total(c)}`; return a;
}

document.addEventListener('focusin',e=>{ if(e.target.matches && e.target.matches('.q input')) focusedInput=e.target; });
document.addEventListener('input',e=>{
  const t=e.target; if(!t.matches||!t.matches('.q input')) return;
  const n=curChapter(); const k=t.dataset.k; state[n][k]=t.value; clearMark(n,k); updateCount(n);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('.opts button'); if(!b) return;
  const n=curChapter(); const k=b.dataset.k; const [ei,ii]=k.split('-').map(Number); const it=CH[n-1].ex[ei].items[ii];
  state[n][k]=b.dataset.v; setPick(document.getElementById('i-'+k),it,b.dataset.v); clearMark(n,k); updateCount(n);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.matches && e.target.matches('.q input')){
    const ins=[...document.querySelectorAll('.q input')]; const i=ins.indexOf(e.target); if(ins[i+1]) ins[i+1].focus();
  }
});
const curChapter = () => SINGLE;

/* ---------- grading ---------- */
const strip = s => s.replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm = s => s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');
function judge(it,v){
  if(v===undefined||v==='') return 'none';
  if(it.t==='pick') return v===it.a?'ok':'bad';
  const x=norm(v);
  if(it.a.some(a=>norm(a)===x)) return 'ok';
  if(it.a.some(a=>strip(norm(a))===strip(x))) return 'half';
  return 'bad';
}
function showMark(n,ei,ii){
  const k=`${ei}-${ii}`, it=CH[n-1].ex[ei].items[ii], m=marks[n][k], li=document.getElementById('i-'+k), fb=document.getElementById('fb-'+k);
  li.classList.remove('ok','bad','half'); if(!m) return; li.classList.add(m);
  const ans = it.t==='pick'?it.a:it.a[0]; const rule = CH[n-1].ex[ei].rule;
  const why = it.why||rule;
  const head = m==='ok'?'✔ 정답':m==='half'?`△ 악센트(´) 확인 · 정답 <b>${ans}</b> (0.5점)`:`✘ 오답 · 정답 <b>${ans}</b>`;
  fb.innerHTML = head + (why?`<span class="why"><b>해설</b> ${why}</span>`:'');
}
function grade(n){
  const c=CH[n-1]; const res={ex:[],score:0,total:0,blank:0};
  c.ex.forEach((e,ei)=>{
    let s=0;
    e.items.forEach((it,ii)=>{
      const k=`${ei}-${ii}`, j=judge(it,state[n][k]);
      if(j==='none'){ marks[n][k]='bad'; res.blank++; } else marks[n][k]=j;
      if(j==='ok') s+=1; else if(j==='half') s+=.5;
      showMark(n,ei,ii);
      if(j==='none'){ document.getElementById('fb-'+k).innerHTML='✘ 미응답 · 정답 <b>'+(it.t==='pick'?it.a:it.a[0])+'</b>'+`<span class="why"><b>해설</b> ${it.why||e.rule}</span>`; }
    });
    document.getElementById('sc'+ei).textContent=`${fmt(s)} / ${e.items.length}`;
    res.ex.push({title:e.title,s,t:e.items.length}); res.score+=s; res.total+=e.items.length;
  });
  lastResult[n]=res;
  const pr=progress(); const old=pr['ch'+n];
  if(!old||res.score>=old.score){ pr['ch'+n]={score:res.score,total:res.total}; store.set('gdu-progress',pr); }
  renderResult(n,true);
}
function renderResult(n,scroll){
  const res=lastResult[n], pct=Math.round(res.score/res.total*100), name=(store.get('gdu-name')||'').trim();
  const msg = pct>=90?['훌륭해요!','거의 완벽합니다. 다음 단원으로 넘어가도 좋아요.']:pct>=70?['잘했어요!','틀린 문제의 해설을 읽고 다시 도전해 보세요.']:pct>=50?['조금만 더!','문법 정리를 한 번 더 읽고 틀린 문제를 다시 풀어 보세요.']:['다시 도전해요','문법 정리를 천천히 읽고 예문을 소리 내어 따라 해 보세요.'];
  const R=54, C=2*Math.PI*R;
  const el=$('#result'); el.hidden=false;
  el.innerHTML=`
   <div class="r-top">
    <div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle class="bg" cx="66" cy="66" r="${R}"/><circle class="fg" cx="66" cy="66" r="${R}" stroke-dasharray="${C*pct/100} ${C}"/></svg><b>${pct}%</b></div>
    <div class="r-txt"><div class="eyebrow">${name?name+' · ':''}UNIDAD ${n} 결과</div><h2>${fmt(res.score)} / ${res.total}점 · ${msg[0]}</h2><p>${msg[1]}</p>${res.blank?`<p>풀지 않은 문제가 ${res.blank}개 있어요. 오답으로 처리되었습니다.</p>`:''}</div>
   </div>
   <div class="brk">${res.ex.map(e=>`<div><span>${e.title}</span><span class="bar"><i style="width:${e.s/e.t*100}%"></i></span><span>${fmt(e.s)}/${e.t}</span></div>`).join('')}</div>
   <div class="r-act"><button class="btn" id="retryWrong">틀린 문제만 다시 풀기</button><button class="btn ghost" id="retryAll">처음부터 다시 풀기</button></div>`;
  $('#retryWrong').onclick=()=>retry(n,false); $('#retryAll').onclick=()=>retry(n,true);
  if(scroll) el.scrollIntoView({behavior:'smooth',block:'center'});
}
function retry(n,all){
  const c=CH[n-1];
  c.ex.forEach((e,ei)=>e.items.forEach((it,ii)=>{
    const k=`${ei}-${ii}`, m=marks[n][k];
    if(all || m!=='ok'){
      delete state[n][k]; clearMark(n,k); const li=document.getElementById('i-'+k);
      if(it.t==='text') li.querySelector('input').value=''; else { li.querySelector('.blank').textContent=''; li.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked','false')); }
    }
  }));
  c.ex.forEach((e,ei)=>{ $('#sc'+ei).textContent=''; });
  delete lastResult[n]; $('#result').hidden=true; updateCount(n);
  const first=document.querySelector('li.item:not(.ok)'); if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); else window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- router ---------- */
function route(){
  chapter(SINGLE);
  window.scrollTo(0,0);
}
route();
</script>
